version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The repo ships docker-compose.yml only (no Dockerfile); the
  # docker-compose ecosystem tracks its pinned image tags/digests.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
